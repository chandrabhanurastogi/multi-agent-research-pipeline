<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4A5E"/></marker><marker id="a-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4BC3"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1B2433" text-anchor="start" font-weight="bold">Research and the trust boundary (once per sub-question)</text><text x="28" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B7F" text-anchor="start">Nothing the model returns is trusted until code checks it. Rejected evidence is kept, with a reason.</text><rect x="28" y="81" width="16" height="13" rx="3" fill="#6D4BC3" stroke="#4B3391"/><text x="50" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">LLM agent</text><rect x="135" y="81" width="16" height="13" rx="3" fill="#0F7B74" stroke="#0A5752"/><text x="157" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Deterministic code</text><rect x="305" y="81" width="16" height="13" rx="3" fill="#1F3A5F" stroke="#142740"/><text x="327" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Orchestration / input</text><rect x="496" y="81" width="16" height="13" rx="3" fill="#2E7D32" stroke="#1B5E20"/><text x="518" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">State and outputs</text><rect x="659" y="81" width="16" height="13" rx="3" fill="#FFF4E5" stroke="#B45309"/><text x="681" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Untrusted / external</text><rect x="843" y="81" width="16" height="13" rx="3" fill="#B42318" stroke="#7A1710"/><text x="865" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Stop or failure</text><rect x="28" y="225" width="150" height="60" rx="30.0" fill="#1F3A5F" stroke="#142740" stroke-width="1.4"/><text x="103.0" y="250.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Sub-question</text><text x="103.0" y="268.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">SQ1 … SQn</text><rect x="225" y="214" width="175" height="82" rx="8" fill="#0F7B74" stroke="#0A5752" stroke-width="1.4"/><text x="312.5" y="250.7" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Search (BM25)</text><text x="312.5" y="269.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle">top 5 documents</text><rect x="445" y="140" width="440" height="230" rx="10" fill="#FFF4E5" stroke="#B45309" stroke-width="1.2"/><text x="457" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#B45309" text-anchor="start" font-weight="bold">UNTRUSTED · model output</text><rect x="470" y="205" width="170" height="100" rx="8" fill="#6D4BC3" stroke="#4B3391" stroke-width="1.4"/><text x="555.0" y="233.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Researcher</text><text x="555.0" y="250.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">LLM</text><text x="555.0" y="268.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">schema-checked;</text><text x="555.0" y="286.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">invalid → retried once</text><rect x="690" y="205" width="175" height="100" rx="8" fill="#FFF4E5" stroke="#B45309" stroke-width="1.4"/><text x="777.5" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1B2433" text-anchor="middle" font-weight="bold">ExtractedClaim</text><text x="777.5" y="259.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B2433" text-anchor="middle">statement</text><text x="777.5" y="277.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B2433" text-anchor="middle">source_id · quote</text><rect x="930" y="175" width="210" height="160" rx="8" fill="#0F7B74" stroke="#0A5752" stroke-width="1.4"/><text x="1035.0" y="224.1" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Trust boundary · code</text><text x="1035.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">1  source was given</text><text x="1035.0" y="259.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">2  quote found in it</text><text x="1035.0" y="277.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">3  not a duplicate</text><text x="1035.0" y="295.7" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">→ ID assigned by code</text><rect x="1180" y="140" width="200" height="230" rx="10" fill="#EEF7EF" stroke="#2E7D32" stroke-width="1.2"/><text x="1192" y="160" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="start" font-weight="bold">VALIDATED</text><rect x="1195" y="175" width="170" height="95" rx="8" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.4"/><text x="1280.0" y="201.3" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Claim</text><text x="1280.0" y="218.6" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#FFFFFF" text-anchor="middle">trusted · C1, C2 …</text><text x="1280.0" y="235.9" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#FFFFFF" text-anchor="middle">tier + origin from</text><text x="1280.0" y="253.1" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#FFFFFF" text-anchor="middle">the source</text><rect x="1195" y="395" width="170" height="85" rx="8" fill="#B42318" stroke="#7A1710" stroke-width="1.4"/><text x="1280.0" y="433.6" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">rejected_claims</text><text x="1280.0" y="450.9" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#FFFFFF" text-anchor="middle">kept with a reason</text><path d="M178,255 L225,255" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M400,255 L470,255" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M640,255 L690,255" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M865,255 L930,255" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M1140,222 L1195,222" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#a-out)"/><rect x="1147.75" y="202.5" width="36.5" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="1166" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-style="italic">pass</text><path d="M1140,300 L1162,300 L1162,437 L1195,437" fill="none" stroke="#B42318" stroke-width="1.8" marker-end="url(#a-stop)"/><rect x="1143.75" y="363.5" width="36.5" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="1162" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#B42318" text-anchor="middle" font-style="italic">fail</text><rect x="225" y="410" width="175" height="70" rx="8" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="1.4"/><text x="312.5" y="441.1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1B2433" text-anchor="middle" font-weight="bold">No LLM call</text><text x="312.5" y="458.4" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#1B2433" text-anchor="middle">sub-question = gap</text><path d="M312,296 L312,410" fill="none" stroke="#5B6B7F" stroke-width="1.8" marker-end="url(#a-muted)"/><rect x="267.25" y="348.5" width="89.5" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="312" y="361" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="middle" font-style="italic">no documents</text><rect x="470" y="410" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="1.4"/><text x="575.0" y="441.1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1B2433" text-anchor="middle" font-weight="bold">No evidence for it</text><text x="575.0" y="458.4" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#1B2433" text-anchor="middle">WARNING issue</text><path d="M555,305 L555,410" fill="none" stroke="#5B6B7F" stroke-width="1.8" marker-end="url(#a-muted)"/><rect x="506.9375" y="363.5" width="96.125" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="555" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="middle" font-style="italic">agent failure</text><text x="462" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B7F" text-anchor="start" font-style="italic">Documents are passed inside &lt;document&gt; delimiters: data, never instructions.</text><text x="930" y="520" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B7F" text-anchor="start" font-style="italic">The model never assigns IDs, tiers or scores: code does.</text></svg>