<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4A5E"/></marker><marker id="a-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D4BC3"/></marker><marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7F"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="28" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1B2433" text-anchor="start" font-weight="bold">Verification and the single revision</text><text x="28" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B7F" text-anchor="start">The Verifier challenges the draft; code limits what its verdict can change. There is no second revision.</text><rect x="28" y="81" width="16" height="13" rx="3" fill="#6D4BC3" stroke="#4B3391"/><text x="50" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">LLM agent</text><rect x="135" y="81" width="16" height="13" rx="3" fill="#0F7B74" stroke="#0A5752"/><text x="157" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Deterministic code</text><rect x="305" y="81" width="16" height="13" rx="3" fill="#1F3A5F" stroke="#142740"/><text x="327" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Orchestration / input</text><rect x="496" y="81" width="16" height="13" rx="3" fill="#2E7D32" stroke="#1B5E20"/><text x="518" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">State and outputs</text><rect x="659" y="81" width="16" height="13" rx="3" fill="#FFF4E5" stroke="#B45309"/><text x="681" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Untrusted / external</text><rect x="843" y="81" width="16" height="13" rx="3" fill="#B42318" stroke="#7A1710"/><text x="865" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5B6B7F" text-anchor="start">Stop or failure</text><rect x="28" y="255" width="165" height="90" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/><text x="110.5" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1B2433" text-anchor="middle" font-weight="bold">Draft</text><text x="110.5" y="304.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B2433" text-anchor="middle">findings F1 … Fn</text><text x="110.5" y="322.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B2433" text-anchor="middle">citations checked</text><rect x="235" y="255" width="150" height="90" rx="8" fill="#6D4BC3" stroke="#4B3391" stroke-width="1.4"/><text x="310.0" y="295.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Verifier</text><text x="310.0" y="314.8" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle">LLM</text><rect x="425" y="255" width="190" height="90" rx="8" fill="#0F7B74" stroke="#0A5752" stroke-width="1.4"/><text x="520.0" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">check_verdicts</text><text x="520.0" y="304.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">support only from</text><text x="520.0" y="322.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">cited claims</text><polygon points="745,240.0 850.0,300 745,360.0 640.0,300" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="745" y="295.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1B2433" text-anchor="middle">All findings</text><text x="745" y="313.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1B2433" text-anchor="middle">fully supported?</text><rect x="1000" y="255" width="170" height="90" rx="8" fill="#0F7B74" stroke="#0A5752" stroke-width="1.4"/><text x="1085.0" y="295.6" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Confidence</text><text x="1085.0" y="314.8" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle">scorer</text><rect x="1205" y="245" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#D5DCE5" stroke-width="1.4"/><text x="1295.0" y="279.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1B2433" text-anchor="middle" font-weight="bold">Outcome</text><text x="1295.0" y="296.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1B2433" text-anchor="middle">unsupported → excluded</text><text x="1295.0" y="312.9" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1B2433" text-anchor="middle">no verdict → kept,</text><text x="1295.0" y="329.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1B2433" text-anchor="middle">capped at 0.39</text><path d="M193,300 L235,300" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M385,300 L425,300" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M615,300 L640,300" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M850,300 L1000,300" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#a-out)"/><rect x="910.0625" y="280.5" width="29.875" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="925" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2E7D32" text-anchor="middle" font-style="italic">yes</text><path d="M1170,300 L1210,300" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><rect x="650" y="430" width="190" height="80" rx="8" fill="#6D4BC3" stroke="#4B3391" stroke-width="1.4"/><text x="745.0" y="465.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Synthesiser revises</text><text x="745.0" y="483.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">given the verdicts</text><rect x="880" y="430" width="160" height="80" rx="8" fill="#6D4BC3" stroke="#4B3391" stroke-width="1.4"/><text x="960.0" y="465.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Verifier</text><text x="960.0" y="483.9" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">re-checks once</text><rect x="1080" y="430" width="160" height="80" rx="8" fill="#0F7B74" stroke="#0A5752" stroke-width="1.4"/><text x="1160.0" y="474.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">check_verdicts</text><path d="M745,360 L745,430" fill="none" stroke="#6D4BC3" stroke-width="1.8" marker-end="url(#a-llm)"/><rect x="745.3125" y="383.5" width="109.375" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6D4BC3" text-anchor="middle" font-style="italic">no: revise once</text><path d="M840,470 L880,470" fill="none" stroke="#6D4BC3" stroke-width="1.8" marker-end="url(#a-llm)"/><path d="M1040,470 L1080,470" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><path d="M1160,430 L1160,395 L1085,395 L1085,345" fill="none" stroke="#3B4A5E" stroke-width="1.8" marker-end="url(#a-line)"/><text x="745" y="532" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B7F" text-anchor="middle" font-style="italic">fails → keep the first draft and its verdicts (warning)</text><rect x="235" y="140" width="330" height="60" rx="8" fill="#B42318" stroke="#7A1710" stroke-width="1.4"/><text x="400.0" y="166.1" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Not verified: every score capped at 0.39</text><text x="400.0" y="183.4" font-family="Helvetica, Arial, sans-serif" font-size="12.0" fill="#FFFFFF" text-anchor="middle">REVIEW issue</text><path d="M310,255 L310,200" fill="none" stroke="#B42318" stroke-width="1.8" marker-end="url(#a-stop)"/><rect x="309.9375" y="216.5" width="96.125" height="18.5" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="358" y="229" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#B42318" text-anchor="middle" font-style="italic">agent failure</text><path d="M565,170 L1085,170 L1085,255" fill="none" stroke="#B42318" stroke-width="1.8" marker-end="url(#a-stop)"/><text x="960" y="532" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B7F" text-anchor="start" font-style="italic">re-check fails → also not verified</text></svg>